<section class="item-root">

    <aside style="--background-side: var(--background-side-arcane)"></aside>

    <article>

        {{> "systems/neph5e/templates/header.hbs"}}

        <main>

            {{> "systems/neph5e/templates/chronology.hbs" title='NEPH5E.periode'}}

            {{#if document.sheet.locked}}
            {{{enrichedDescription}}}
            {{else}}
            <h1>{{translate "description"}}</h1>
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{/if}}

        </main>

    </article>

</section>
