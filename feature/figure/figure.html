<section class="actor-root skin-{{document.system.options.theme}}">

    <aside>

        <img
            src="{{document.img}}"
            data-edit="img"
            data-action="editImage"/>

        <nav>
            {{#each tabs as |tab|}}
            <div>
                <a data-action="tab" data-group="{{tab.group}}" data-tab="{{tab.id}}">{{translate tab.label}}</a>
                <!--
                <img class="sheet-navigation-pin"/>
                <img class="sheet-navigation-hole"/>
                -->
            </div>
            {{/each}}
        </nav>

        {{#if actor.simulacre}}
        <img class="simulacre" src="{{actor.simulacre.img}}"/>
        {{/if}}

    </aside>

    <article>

        <header>

            <input
                name="name"
                type="text"
                value="{{document.name}}"
                spellcheck="false"
                {{#if document.sheet.locked}} disabled{{/if}}/>

            <img/>

        </header>

        {{#each tabs as |tab|}}
            {{#if tab.active}}
                {{> (lookup . "template") .. from=tab.from science=tab.science header=tab.header cercles=tab.cercles catalyseurs=tab.catalyseurs}}
            {{/if}}
        {{/each}}

    </article>

</section>
