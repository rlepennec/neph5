<section class="actor-root soleil">

    <aside>

        <img
            src="{{document.img}}"
            data-edit="img"
            data-action="editImage"/>

        <nav>
            {{#each tabs as |tab|}}
            <div>
                <a data-action="tab" data-group="{{tab.group}}" data-tab="{{tab.id}}">{{translate tab.label}}</a>
                <!--
                <img class="sheet-navigation-pin"/>
                <img class="sheet-navigation-hole"/>
                -->
            </div>
            {{/each}}
        </nav>

    </aside>

    <article>

        <header>

            <input
                name="name"
                type="text"
                value="{{document.name}}"
                spellcheck="false"
                {{#if document.sheet.locked}} disabled{{/if}}/>

            <img/>

        </header>

        <main>

            {{#each tabs as |tab|}}
                {{#if tab.active}}
                    {{> (lookup . "template") ..}}
                {{/if}}
            {{/each}}

        </main>

    </article>

</section>
