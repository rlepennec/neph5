<section class="item-root">

    <aside style="--background-side: var(--background-side-sort)"></aside>

    <article>

        {{> "systems/neph5e/templates/item-header.hbs"}}

        <main>

            {{#if document.sheet.locked}}
            {{{enrichedDescription}}}
            {{else}}
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{/if}}

        </main>

    </article>

</section>
