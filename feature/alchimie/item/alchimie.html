<section class="item-root">
    
    <div class="side">
        <img src="systems/neph5e/assets/core/site-formule.webp" title="{{localize 'ITEM.TypeAlchimie'}}"/>
    </div>

    <div class="article">

        {{> "systems/neph5e/templates/item/parts/header/header.hbs"}}

        <div class="body">

            {{log .}}

            {{#if editable}}
                <prose-mirror
                    name="description"
                    button="true"
                    editable="{{editable}}"
                    toggled="false"
                    value="{{document.system.description}}">
                    {{{enrichedDescription}}}
                </prose-mirror>
            {{else}}
                {{{enrichedDescription}}}
            {{/if}}

<!--
            {{> "systems/neph5e/templates/item/parts/body/description.hbs"}}
-->
        </div>

    </div>

</section>
