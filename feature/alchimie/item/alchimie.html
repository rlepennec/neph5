<section class="item-root">
    
    <div class="side">
        <img src="systems/neph5e/assets/core/site-formule.webp" title="{{localize 'ITEM.TypeAlchimie'}}"/>
    </div>

    <div class="article">

        <div class="header">

            <input

                {{#if (and debug isGM)}}
                    type="text"
                    class="uuid"
                    {{else}}
                    type="hidden"
                {{/if}}

                name="document.system.id"
                type="text"
                value="{{document.system.id}}"
                data-dtype="String"/>

            <div class="title">

                <input
                    name="name"
                    type="text"
                    value="{{document.name}}"
                    class="name"/>

                <img
                    src="{{document.img}}"
                    title="{{document.name}}"
                    data-edit="img"
                    class="image"/>

            </div>

        </div>


        {{> "systems/neph5e/templates/item/parts/header/header.hbs"}}

        <div class="body">

            {{log .}}

            {{#if editable}}
                <prose-mirror
                    name="description"
                    button="true"
                    editable="{{editable}}"
                    toggled="false"
                    value="{{document.system.description}}">
                    {{{enrichedDescription}}}
                </prose-mirror>
            {{else}}
                {{{enrichedDescription}}}
            {{/if}}

<!--
            {{> "systems/neph5e/templates/item/parts/body/description.hbs"}}
-->
        </div>

    </div>

</section>
