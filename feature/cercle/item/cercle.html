<section class="item-root">
{{log .}}
    <div class="side">
        <img src="systems/neph5e/assets/core/site-formule.webp" title="{{localize 'ITEM.TypeCercle'}}"/>
    </div>

    <div class="article">

        <div class="header">
 
            <div class="title">

                <input
                    name="name"
                    type="text"
                    value="{{document.name}}"
                    class="name"/>

                <img
                    src="{{document.img}}"
                    title="{{document.name}}"
                    data-edit="img"
                    class="image"/>

            </div>

        </div>

        <div class="body">

            {{#if editable}}
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{else}}
            {{{enrichedDescription}}}
            {{/if}}

        </div>

    </div>

</section>
