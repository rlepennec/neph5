<section class="item-root style-ashbury">

    <aside></aside>

    <article>

        <header>
            <input
                name="name"
                type="text"
                value="{{name}}"
                {{#if locked}} disabled{{/if}}/>
        </header>

        <main>

            <div class="vk-banner">
                <div class="vk-fields">
                    {{> "systems/neph5e/templates/input.hbs"
                        title="degre"
                        class="circle"
                        name="degre"
                        value=degre
                    }}
                </div>
            </div>

            <div class="vk-editor">
                {{#if editable}}
                <prose-mirror
                    name="description"
                    button="true"
                    editable="true"
                    value="{{description}}">
                    {{{enrichedDescription}}}
                </prose-mirror>
                {{else}}
                <div>{{{enrichedDescription}}}</div>
                {{/if}}
            </div>

        </main>

    </article>

</section>
