<section class="item-root style-classique">

    <aside></aside>

    <article>

        <header>
            <input
                name="name"
                type="text"
                value="{{name}}"/>
        </header>

        <main>

            <div class="banner">

                {{> "systems/neph5e/templates/input.hbs"
                    title="degre"
                    class="circle"
                    name="degre"
                    value=degre
                }}

            </div>

            <prose-mirror
                name="description"
                button="true"
                editable="true"
                value="{{description}}">
                {{{enrichedDescription}}}
            </prose-mirror>

        </main>

        <footer class="mnemos-footer">
            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i> Sauver
            </button>
        </footer>

    </article>

</section>
