<section class="item-root style-classique">

    <aside></aside>

    <article>

        <header>
            <input
                name="name"
                type="text"
                value="{{name}}"
                {{#if locked}} disabled{{/if}}/>
        </header>

        <main>

            <div class="banner">

                {{> "systems/neph5e/templates/input.hbs"
                    title="degre"
                    class="circle"
                    name="degre"
                    value=degre
                    disabled=locked
                }}

            </div>

            {{#if editable}}
            <prose-mirror
                name="description"
                button="true"
                editable="true"
                value="{{description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{else}}
            <div>{{{enrichedDescription}}}</div>
            {{/if}}

        </main>

    </article>

</section>
