<section class="item-root">

    <aside>
    </aside>

    <article>

        <header>

            <input
                name="name"
                type="text"
                value="{{document.name}}"/>

            <img
                src="{{document.img}}"
                title="{{document.name}}"
                data-edit="img"
                data-action="editImage"/>

        </header>

        <main>

            <h1>Compétences</h1>
            <ul class="column-2">
                {{#each sheet.competences as |competence|}}
                <li data-action="openLink" data-uuid="{{competence.uuid}}" data-id="Item.competence.{{competence.id}}"><i class="fas fa-trash"></i>{{competence.name}}</li>
                {{/each}}
            </ul>

             <h1>Description</h1>
            {{#if editable}}
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{else}}
            {{{enrichedDescription}}}
            {{/if}}

        </main>

    </article>

</section>
