<section class="item-root">
{{log .}}
    <aside>
    </aside>

    <article>

        <header>

            <input
                name="name"
                type="text"
                value="{{document.name}}"/>

            <img
                src="{{document.img}}"
                title="{{document.name}}"
                data-edit="img"
                data-action="editImage"/>

        </header>

        <main>

            {{#unless (isEmptyCollection document.system.competences)}}
            <h1>Compétences</h1>
            <ol>

                {{#each competences as |competence|}}
                {{log competence}}
                <li><i class="fas fa-trash">{{competence}}</i>a</li>
                {{/each}}

            </ol>
             {{/unless}}

             <h1>Description</h1>
            {{#if editable}}
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{else}}
            {{{enrichedDescription}}}
            {{/if}}

        </main>

    </article>

</section>
