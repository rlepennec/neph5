<section class="item-root">

    <aside>
    </aside>

    <article>

        <header>

            <input
                name="name"
                type="text"
                value="{{document.name}}"/>

            <img
                src="{{document.img}}"
                title="{{document.name}}"
                data-edit="img"
                data-action="editImage"/>

        </header>

        <main>

            {{#unless (isEmptyCollection document.system.competences)}}
            <p>Compétences:</p>
            <ol>
                {{#each document.system.competences as |competence-uuid|}}
                <li>{{competence-uuid}}</li>
                {{/each}}

            </ol>
             {{/unless}}

             <p>Description:</p>
            {{#if editable}}
            <prose-mirror
                name="system.description"
                button="true"
                editable="{{editable}}"
                toggled="false"
                value="{{document.system.description}}">
                {{{enrichedDescription}}}
            </prose-mirror>
            {{else}}
            {{{enrichedDescription}}}
            {{/if}}

        </main>

    </article>

</section>
