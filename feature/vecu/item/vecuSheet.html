<section class="item-root">

    <aside>
    </aside>

    <article>

        {{> "systems/neph5e/templates/item-header.hbs"}}

        <main>

            <h1>Compétences</h1>
            <ul class="column-2">
                {{#each sheet.competences as |competence|}}
                <li data-action="openLink" data-uuid="{{competence.uuid}}" data-id="Item.competence.{{competence.id}}">
                    <i class="fas fa-trash" data-action="delete"></i>{{competence.name}}
                </li>
                {{/each}}
            </ul>

            {{> "systems/neph5e/templates/item-description.hbs" title="Description"}}

        </main>

    </article>

</section>
