<section class="item-root" data-drop="true">

    <aside class="vk-aside"></aside>

    <article>

        {{> "systems/neph5e/templates/header.hbs"}}

        <main class="vk-body">

            <div class="vk-armure-layout">

                {{!-- 1. Bandeau : protection physique / magique --}}
                <div class="vk-armure-stats-band">

                    <div class="vk-armure-stat-block">
                        <span class="vk-armure-stat-label">{{translate "physique"}}</span>
                        <input
                            class="vk-armure-stat-circle"
                            type="number"
                            name="system.physique"
                            value="{{document.system.physique}}"
                            {{#if document.sheet.locked}}disabled{{/if}}/>
                    </div>

                    <div class="vk-armure-sep"></div>

                    <div class="vk-armure-stat-block">
                        <span class="vk-armure-stat-label">{{translate "magique"}}</span>
                        <input
                            class="vk-armure-stat-circle"
                            type="number"
                            name="system.magique"
                            value="{{document.system.magique}}"
                            {{#if document.sheet.locked}}disabled{{/if}}/>
                    </div>

                </div>

                {{!-- 2. Corps : description (gauche) + illustration (droite) --}}
                <div class="vk-armure-body">

                    <div class="vk-armure-desc-col">
                        <div class="vk-armure-glass-box">
                            <div class="vk-armure-editor">
                                <prose-mirror
                                    name="system.description"
                                    button="true"
                                    editable="{{editable}}"
                                    toggled="false"
                                    value="{{document.system.description}}">
                                    {{{enrichedDescription}}}
                                </prose-mirror>
                            </div>
                        </div>
                    </div>

                    <div class="vk-armure-img-col">
                        <div class="vk-armure-img-wrap">
                            <img
                                class="vk-armure-img"
                                src="{{document.system.illustration}}"
                                title="{{document.name}}"
                                data-edit="system.illustration"
                                data-action="editImage"/>
                            <div class="vk-armure-img-inner">
                                <div class="vk-armure-scan-overlay"></div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </main>

    </article>

</section>
