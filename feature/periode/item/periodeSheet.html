<section class="item-root"s>

    <aside>
    </aside>

    <article>

        {{> "systems/neph5e/templates/item-header.hbs"}}

        <main>

            <h1>Epoque</h1>
            <input
                name="system.epoque"
                type="text"
                value="{{document.system.epoque}}"/>

            <h1>Région</h1>
            <input
                name="system.region"
                type="text"
                value="{{document.system.region}}"/>

            <h1>Vécus</h1>
            <ul class="column-2">
                {{#each sheet.vecus as |vecu|}}
                <li data-action="open" data-uuid="{{vecu.uuid}}" data-id="Item.vecu.{{vecu.id}}">
                    <i class="fas fa-trash" data-action="delete"></i>{{vecu.name}}
                </li>
                {{/each}}
            </ul>

            {{> "systems/neph5e/templates/item-description.hbs" title="Description"}}

        </main>

    </article>

</section>
