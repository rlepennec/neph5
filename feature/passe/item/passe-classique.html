<section class="item-root style-classique">

    <aside></aside>

    <article>

        {{> "systems/neph5e/templates/header.hbs"}}

        <main class="classique-body">

            <div class="classique-layout">

                {{> "systems/neph5e/templates/chronology.hbs" title='NEPH5E.periode'}}

                {{#if editable}}
                <prose-mirror
                    name="system.description"
                    value="{{document.system.description}}"
                    editable="true"
                    button="true">
                    {{{enrichedDescription}}}
                </prose-mirror>
                {{else}}
                {{#if (isEmptyHtml document.system.description)}}
                <span>{{translate "description"}}</span>
                {{else}}
                <div>{{{enrichedDescription}}}</div>
                {{/if}}
                {{/if}}

            </div>

        </main>

    </article>

</section>
