<section class="item-root style-classique">

    <aside></aside>

    <article>

        {{> "systems/neph5e/templates/header.hbs"}}

        <main class="classique-body">

            <div class="classique-layout">

                {{> "systems/neph5e/templates/chronology.hbs" title='NEPH5E.periode'}}

                <div class="classique-desc-box">
                    <h3 class="classique-title">{{translate "description"}}</h3>
                    <div class="classique-editor">
                        <prose-mirror
                            name="system.description"
                            button="true"
                            editable="{{editable}}"
                            toggled="false"
                            value="{{document.system.description}}">
                            {{{enrichedDescription}}}
                        </prose-mirror>
                    </div>
                </div>

            </div>

        </main>

    </article>

</section>
